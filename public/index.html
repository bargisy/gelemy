<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex justify-center pb-20 sm:p-4">

  <!-- Landing / Login View -->
  <div id="landing-view" class="w-full max-w-md sm:mt-10 bg-white sm:rounded-xl shadow-sm sm:shadow-lg p-8 text-center transition-all duration-300">
    <div class="w-16 h-16 bg-blue-50 text-[#1A4BAF] rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <h1 class="text-2xl font-bold mb-2">Financial Tracker</h1>
    <p class="text-gray-500 mb-8">Log daily project income and expenses directly into a secure Google Sheet.</p>
    <button id="auth-btn" class="w-full bg-[#1A4BAF] hover:bg-[#009EFF] text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
      Connect Google Account
    </button>
  </div>

  <!-- Main App View -->
  <div id="app-view" class="w-full max-w-md bg-white sm:rounded-xl shadow-sm sm:shadow-lg hidden flex-col h-screen sm:h-auto overflow-hidden">
    
    <!-- Header Navigation -->
    <div class="flex border-b border-gray-200 bg-white shrink-0">
      <button onclick="switchTab('reports')" id="nav-reports" class="flex-1 py-4 text-sm font-medium text-gray-500 border-b-2 border-transparent transition-colors">Reports</button>
      <button onclick="switchTab('entry')" id="nav-entry" class="flex-1 py-4 text-sm font-medium text-[#1A4BAF] border-b-2 border-[#1A4BAF] transition-colors">New Entry</button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex-1 py-4 text-sm font-medium text-gray-500 border-b-2 border-transparent transition-colors">Settings</button>
    </div>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-y-auto p-6 bg-gray-50">

      <!-- ================== TAB: REPORTS ================== -->
      <div id="tab-reports" class="hidden space-y-6">
        <div>
          <h2 class="text-xl font-bold text-gray-800 mb-4">Financial Report</h2>
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Start Date</label>
              <input type="date" id="report-start" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#009EFF]">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">End Date</label>
              <input type="date" id="report-end" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#009EFF]">
            </div>
          </div>
          <button onclick="generateReport()" id="btn-generate-report" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
            Generate Report
          </button>
        </div>

        <!-- Report Results Container -->
        <div id="report-results" class="hidden space-y-4">
          <!-- Summary Cards -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p class="text-xs font-medium text-gray-500">Total Income</p>
              <p class="text-lg font-bold text-green-600" id="rep-income">$0.00</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p class="text-xs font-medium text-gray-500">Total Expenses</p>
              <p class="text-lg font-bold text-red-600" id="rep-expense">$0.00</p>
            </div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center">
            <p class="text-sm font-medium text-gray-500">Net Profit</p>
            <p class="text-xl font-bold" id="rep-net">$0.00</p>
          </div>

          <!-- Project Breakdown -->
          <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="bg-gray-100 px-4 py-2 border-b border-gray-200">
              <p class="text-xs font-bold text-gray-600 uppercase tracking-wider">By Project</p>
            </div>
            <ul id="rep-projects" class="divide-y divide-gray-100 text-sm">
              <!-- Populated by JS -->
            </ul>
          </div>
        </div>
      </div>

      <!-- ================== TAB: NEW ENTRY ================== -->
      <div id="tab-entry" class="space-y-5">
        <form id="entry-form" class="space-y-5">
          <div class="grid grid-cols-2 gap-4">
            <label class="cursor-pointer">
              <input type="radio" name="tx_type" value="Income" class="peer sr-only" required>
              <div class="rounded-xl border-2 border-transparent bg-white p-4 flex flex-col items-center justify-center gap-2 transition-all peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700 text-gray-400 shadow-sm hover:shadow">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                <span class="font-medium">Income</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tx_type" value="Expense" class="peer sr-only">
              <div class="rounded-xl border-2 border-transparent bg-white p-4 flex flex-col items-center justify-center gap-2 transition-all peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-700 text-gray-400 shadow-sm hover:shadow">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                <span class="font-medium">Expense</span>
              </div>
            </label>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Project</label>
            <select id="project" required class="w-full border-gray-300 border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-[#009EFF] outline-none bg-white shadow-sm">
              <!-- Populated by JS -->
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Amount ($)</label>
            <input type="number" id="amount" step="0.01" required class="w-full border-gray-300 border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-[#009EFF] outline-none shadow-sm" placeholder="0.00">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes / Description</label>
            <input type="text" id="notes" required class="w-full border-gray-300 border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-[#009EFF] outline-none shadow-sm" placeholder="e.g., Software license">
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-[#1A4BAF] hover:bg-[#009EFF] text-white font-medium py-3 px-4 rounded-lg transition-colors mt-4 shadow-md">
            Log Transaction
          </button>
          <div id="status-msg" class="text-sm text-center font-medium mt-2 hidden"></div>
        </form>
      </div>

      <!-- ================== TAB: SETTINGS ================== -->
      <div id="tab-settings" class="hidden space-y-6">
        
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
          <h3 class="text-lg font-bold mb-4 text-gray-800">Manage Projects</h3>
          <div class="flex gap-2 mb-4">
            <input type="text" id="new-project-name" placeholder="New project..." class="flex-1 border-gray-300 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#009EFF]">
            <button onclick="addProject()" class="bg-[#FFD850] text-gray-900 px-4 py-2 rounded-lg font-medium hover:bg-yellow-500 transition text-sm">Add</button>
          </div>
          <ul id="project-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
            <!-- Populated by JS -->
          </ul>
        </div>

        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm space-y-3">
          <h3 class="text-lg font-bold text-gray-800">Database Options</h3>
          <a id="sheet-link" href="#" target="_blank" class="w-full block text-center bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2.5 rounded-lg transition-colors text-sm">
            Open Google Sheet ↗
          </a>
        </div>

      </div>

    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const CLIENT_ID = "989585036388-a9gvr4po1ol1c4urh25iegcc0cirtc06.apps.googleusercontent.com"; 
    const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets.readonly";
    
    let tokenClient;
    let accessToken = null;
    let spreadsheetId = localStorage.getItem("financial_tracker_sheet_id");
    let projects = JSON.parse(localStorage.getItem('tracker_projects')) || ['General'];

    window.onload = () => {
      // Set default report dates to current month
      const today = new Date();
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      document.getElementById('report-start').value = firstDay.toISOString().split('T')[0];
      document.getElementById('report-end').value = today.toISOString().split('T')[0];

      renderProjectDropdown();
      renderProjectList();
      
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.error) return console.error(response);
          accessToken = response.access_token;
          
          if (!spreadsheetId) {
            await createMasterSheet();
          } else {
            document.getElementById('landing-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('sheet-link').href = `https://docs.google.com/spreadsheets/d/${spreadsheetId}`;
          }
        },
      });

      document.getElementById('auth-btn').onclick = () => tokenClient.requestAccessToken({ prompt: 'consent' });
      document.getElementById('entry-form').onsubmit = appendTransaction;
    };

    // --- TAB SWITCHING LOGIC ---
    function switchTab(tabName) {
      // Reset text colors and borders
      ['reports', 'entry', 'settings'].forEach(t => {
        document.getElementById(`nav-${t}`).className = "flex-1 py-4 text-sm font-medium text-gray-500 border-b-2 border-transparent transition-colors";
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      // Set active
      document.getElementById(`nav-${tabName}`).className = "flex-1 py-4 text-sm font-medium text-[#1A4BAF] border-b-2 border-[#1A4BAF] transition-colors";
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    }

    // --- PROJECT MANAGEMENT ---
    function saveProjects() {
      localStorage.setItem('tracker_projects', JSON.stringify(projects));
      renderProjectDropdown();
      renderProjectList();
    }

    function renderProjectDropdown() {
      const select = document.getElementById('project');
      select.innerHTML = '';
      projects.forEach(p => select.add(new Option(p, p)));
    }

    function renderProjectList() {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      projects.forEach((p, i) => {
        list.innerHTML += `
          <li class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
            <span class="text-sm font-medium truncate flex-1">${p}</span>
            <div class="flex gap-3 ml-2">
              <button onclick="renameProject(${i})" class="text-xs text-blue-600 font-medium">Edit</button>
              <button onclick="deleteProject(${i})" class="text-xs text-red-600 font-medium">Del</button>
            </div>
          </li>`;
      });
    }

    function addProject() {
      const input = document.getElementById('new-project-name');
      const val = input.value.trim();
      if (val && !projects.includes(val)) {
        projects.push(val);
        input.value = '';
        saveProjects();
      }
    }

    function deleteProject(index) {
      if(confirm(`Delete "${projects[index]}"?`)) {
        projects.splice(index, 1);
        saveProjects();
      }
    }

    function renameProject(index) {
      const newName = prompt("Rename project:", projects[index]);
      if(newName && newName.trim() !== "") {
        projects[index] = newName.trim();
        saveProjects();
      }
    }

    // --- GOOGLE SHEETS API (WRITE) ---
    async function createMasterSheet() {
      const btn = document.getElementById('auth-btn');
      btn.innerText = "Setting up your database...";
      btn.disabled = true;

      const response = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
        method: "POST",
        headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          properties: { title: "Daily Financial Tracker" },
          sheets: [{
            properties: { title: "Transactions" },
            data: [{
              startRow: 0, startColumn: 0,
              rowData: [{
                values: [
                  { userEnteredValue: { stringValue: "Date" } },
                  { userEnteredValue: { stringValue: "Project" } },
                  { userEnteredValue: { stringValue: "Type" } },
                  { userEnteredValue: { stringValue: "Amount" } },
                  { userEnteredValue: { stringValue: "Notes" } }
                ]
              }]
            }]
          }]
        })
      });
      const data = await response.json();
      spreadsheetId = data.spreadsheetId;
      localStorage.setItem("financial_tracker_sheet_id", spreadsheetId);
      
      document.getElementById('landing-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      document.getElementById('sheet-link').href = `https://docs.google.com/spreadsheets/d/${spreadsheetId}`;
    }

    async function appendTransaction(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-msg');
      submitBtn.disabled = true;
      submitBtn.innerText = "Logging...";

      const typeStr = document.querySelector('input[name="tx_type"]:checked').value;
      const row = [
        new Date().toISOString().split("T")[0],
        document.getElementById('project').value,
        typeStr,
        parseFloat(document.getElementById('amount').value),
        document.getElementById('notes').value
      ];

      try {
        const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/Transactions!A:E:append?valueInputOption=USER_ENTERED`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
          body: JSON.stringify({ values: [row] }),
        });

        if (response.ok) {
          document.getElementById('entry-form').reset();
          statusMsg.innerText = "Entry logged successfully!";
          statusMsg.className = "text-sm text-center font-medium mt-2 text-green-600 block";
        } else {
          throw new Error("API Error");
        }
      } catch (err) {
        statusMsg.innerText = "Failed to log. Try refreshing.";
        statusMsg.className = "text-sm text-center font-medium mt-2 text-red-600 block";
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "Log Transaction";
      setTimeout(() => { statusMsg.classList.add('hidden'); }, 3000);
    }

    // --- GOOGLE SHEETS API (READ & REPORT) ---
    async function generateReport() {
      const btn = document.getElementById('btn-generate-report');
      const startStr = document.getElementById('report-start').value;
      const endStr = document.getElementById('report-end').value;
      
      btn.innerText = "Fetching Data...";
      btn.disabled = true;

      try {
        // We added spreadsheets.readonly to the scopes at the top so we can GET data
        const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/Transactions!A2:E`, {
          method: "GET",
          headers: { "Authorization": `Bearer ${accessToken}` }
        });
        
        const data = await response.json();
        const rows = data.values || [];
        
        let totalIncome = 0;
        let totalExpense = 0;
        let projectStats = {};

        // Process data
        rows.forEach(row => {
          const date = row[0];
          const project = row[1];
          const type = row[2];
          const amount = parseFloat(row[3].replace(/[^0-9.-]+/g,"")) || 0; // Strip currency symbols if sheets added them

          // Simple string comparison works for YYYY-MM-DD
          if (date >= startStr && date <= endStr) {
            if (!projectStats[project]) projectStats[project] = { income: 0, expense: 0 };
            
            if (type === "Income") {
              totalIncome += amount;
              projectStats[project].income += amount;
            } else if (type === "Expense") {
              totalExpense += amount;
              projectStats[project].expense += amount;
            }
          }
        });

        // Update UI
        const net = totalIncome - totalExpense;
        document.getElementById('rep-income').innerText = `$${totalIncome.toFixed(2)}`;
        document.getElementById('rep-expense').innerText = `$${totalExpense.toFixed(2)}`;
        
        const netEl = document.getElementById('rep-net');
        netEl.innerText = `$${Math.abs(net).toFixed(2)}`;
        netEl.className = `text-xl font-bold ${net >= 0 ? 'text-green-600' : 'text-red-600'}`;

        // Populate Project List
        const projList = document.getElementById('rep-projects');
        projList.innerHTML = '';
        
        if (Object.keys(projectStats).length === 0) {
          projList.innerHTML = '<li class="p-4 text-gray-500 text-center italic">No transactions found for this period.</li>';
        } else {
          for (const [projName, stats] of Object.entries(projectStats)) {
            const pNet = stats.income - stats.expense;
            projList.innerHTML += `
              <li class="px-4 py-3 flex justify-between items-center">
                <div>
                  <p class="font-bold text-gray-800">${projName}</p>
                  <p class="text-xs text-gray-500">In: $${stats.income.toFixed(2)} | Out: $${stats.expense.toFixed(2)}</p>
                </div>
                <span class="font-bold ${pNet >= 0 ? 'text-green-600' : 'text-red-600'}">
                  ${pNet >= 0 ? '+' : '-'}$${Math.abs(pNet).toFixed(2)}
                </span>
              </li>`;
          }
        }

        document.getElementById('report-results').classList.remove('hidden');

      } catch (err) {
        console.error("Report Error:", err);
        alert("Could not generate report. You may need to reconnect your account.");
      }

      btn.innerText = "Generate Report";
      btn.disabled = false;
    }
  </script>
</body>
</html>
