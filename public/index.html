<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Gelemy</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A4BAF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans m-0 p-0 flex justify-center min-h-screen transition-colors duration-300">

  <div id="toast-notification" class="fixed top-6 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-white px-5 py-3 rounded-xl shadow-2xl z-[70] hidden transition-opacity flex items-center gap-3 w-[90%] max-w-sm">
    <span id="toast-icon" class="text-lg">✅</span>
    <span id="toast-message" class="text-sm font-medium"></span>
  </div>

  <div id="custom-prompt-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-[60] p-4 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-sm p-6 relative">
      <h3 id="prompt-title" class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-1"></h3>
      <p id="prompt-message" class="text-sm text-gray-500 dark:text-gray-400 mb-4"></p>
      <input type="text" id="prompt-input" class="w-full bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#009EFF] text-gray-900 dark:text-white mb-5 placeholder-gray-400 dark:placeholder-gray-500">
      <div class="flex justify-end gap-3">
        <button id="prompt-cancel" class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white transition-colors">Cancel</button>
        <button id="prompt-confirm" class="px-4 py-2 text-sm font-medium bg-[#1A4BAF] text-white rounded-lg hover:bg-[#009EFF] transition-colors shadow-sm">Confirm</button>
      </div>
    </div>
  </div>

  <div id="custom-confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-[60] p-4 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-sm p-6 relative">
      <h3 id="confirm-title" class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-2"></h3>
      <p id="confirm-message" class="text-sm text-gray-500 dark:text-gray-400 mb-6 leading-relaxed"></p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel" class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white transition-colors">Cancel</button>
        <button id="confirm-confirm" class="px-4 py-2 text-sm font-medium bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors shadow-sm">Delete</button>
      </div>
    </div>
  </div>

  <div id="install-banner" class="hidden fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#1A4BAF] text-white px-4 py-3 flex justify-between items-center shadow-lg z-50 transition-all pt-[max(0.75rem,env(safe-area-inset-top))]">
    <div class="flex items-center gap-3">
      <span class="text-xl">📲</span>
      <span class="text-xs sm:text-sm font-medium leading-tight">Install Gelemy for quick offline access</span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="banner-install-btn" class="bg-white text-[#1A4BAF] px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm hover:bg-gray-100 transition-colors">
        Install
      </button>
      <button id="banner-close-btn" class="p-1 text-white opacity-80 hover:opacity-100 transition-opacity">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>

  <div id="landing-view" class="w-full max-w-md bg-gray-900 min-h-screen shadow-2xl sm:border-x border-gray-800 p-8 flex flex-col justify-center items-center transition-all duration-300">
    
    <img src="Logo.svg" alt="Gelemy Logo" class="w-72 h-72 max-w-full mx-auto mb-6 object-contain drop-shadow-lg
